<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AstrBot Math Render logo</title>
  <desc id="desc">A glowing integral symbol over coordinate axes and a colorful mathematical curve.</desc>
  <defs>
    <linearGradient id="bg" x1="34" y1="24" x2="478" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B45"/>
      <stop offset="0.52" stop-color="#182E67"/>
      <stop offset="1" stop-color="#0A1738"/>
    </linearGradient>
    <linearGradient id="curve" x1="92" y1="352" x2="430" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D6FF"/>
      <stop offset="0.5" stop-color="#74F0C2"/>
      <stop offset="1" stop-color="#FFB45B"/>
    </linearGradient>
    <linearGradient id="integral" x1="250" y1="103" x2="313" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9ECFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(335 175) rotate(132) scale(255)">
      <stop stop-color="#4DDFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4DDFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="curveGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#cardClip)">
    <circle cx="350" cy="166" r="255" fill="url(#glow)"/>
    <path d="M55 117H468M55 190H468M55 263H468M55 336H468M55 409H468" stroke="#A9C7FF" stroke-opacity="0.1" stroke-width="2"/>
    <path d="M105 61V455M178 61V455M251 61V455M324 61V455M397 61V455" stroke="#A9C7FF" stroke-opacity="0.1" stroke-width="2"/>

    <path d="M74 365H446" stroke="#D4E6FF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
    <path d="M111 429V78" stroke="#D4E6FF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
    <path d="m438 354 10 11-10 11M100 88l11-10 11 10" fill="none" stroke="#D4E6FF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M76 323 C116 274 145 299 177 329 S238 386 274 315 S337 151 376 208 S413 302 451 158" fill="none" stroke="#4EDBFF" stroke-opacity="0.25" stroke-width="18" stroke-linecap="round" filter="url(#curveGlow)"/>
    <path d="M76 323 C116 274 145 299 177 329 S238 386 274 315 S337 151 376 208 S413 302 451 158" fill="none" stroke="url(#curve)" stroke-width="8" stroke-linecap="round" filter="url(#curveGlow)"/>
    <circle cx="274" cy="315" r="8" fill="#FFFFFF" stroke="#74F0C2" stroke-width="5"/>
    <circle cx="376" cy="208" r="8" fill="#FFFFFF" stroke="#FFB45B" stroke-width="5"/>

    <path d="M283 102 C250 105 239 132 246 166 L270 341 C276 383 261 405 229 408" fill="none" stroke="#74DFFF" stroke-opacity="0.28" stroke-width="28" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M283 102 C250 105 239 132 246 166 L270 341 C276 383 261 405 229 408" fill="none" stroke="url(#integral)" stroke-width="17" stroke-linecap="round"/>
    <path d="M281 102 C304 101 322 105 338 112" fill="none" stroke="url(#integral)" stroke-width="17" stroke-linecap="round"/>
    <path d="M226 408 C250 412 272 410 291 402" fill="none" stroke="url(#integral)" stroke-width="17" stroke-linecap="round"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#A8C9FF" stroke-opacity="0.22" stroke-width="4"/>
  <circle cx="427" cy="86" r="7" fill="#FFB45B"/>
  <circle cx="451" cy="86" r="7" fill="#74F0C2"/>
</svg>
